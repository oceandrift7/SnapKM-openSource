name: Build SnapKM sideload dylib

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.m'
      - '**/*.h'
      - '**/*.xm'
      - 'Makefile'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos and signing tool
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          brew install ldid
      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$HOME/theos/sdks"
          find "$RUNNER_TEMP/theos-sdks" -maxdepth 1 -name '*.sdk' -type d -exec cp -R {} "$HOME/theos/sdks/" \;
          ls "$HOME/theos/sdks"
      - name: Build standalone dynamic library
        run: |
          sed -e 's/^TWEAK_NAME = SnapKM/LIBRARY_NAME = SnapKM/' -e 's@/tweak.mk@/library.mk@' Makefile > Makefile.sideload
          make -f Makefile.sideload -j2 FINALPACKAGE=1
      - name: Inspect and collect dylib
        run: |
          mkdir -p output
          # Copy the final fat dylib only; recursive find also matches dSYM debug companions.
          test -s .theos/obj/SnapKM.dylib
          cp .theos/obj/SnapKM.dylib output/SnapKM.dylib
          file output/SnapKM.dylib
          lipo -info output/SnapKM.dylib
          otool -hv -arch arm64 output/SnapKM.dylib | grep -q DYLIB
          otool -L output/SnapKM.dylib
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SnapKM-sideload-dylib
          path: output/SnapKM.dylib
          if-no-files-found: error
