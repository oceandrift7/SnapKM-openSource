name: Build SnapKM dylib

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.m'
      - '**/*.h'
      - '**/*.xm'
      - 'Makefile'
      - 'control'
      - '.github/workflows/build.yml'

jobs:
  package:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$HOME/theos/sdks"
          find "$RUNNER_TEMP/theos-sdks" -maxdepth 1 -name '*.sdk' -type d -exec cp -R {} "$HOME/theos/sdks/" \;
          ls "$HOME/theos/sdks"
      - name: Build dylib
        run: make FINALPACKAGE=1
      - name: Collect dylib
        run: |
          mkdir -p output
          find .theos/obj -type f -name 'SnapKM.dylib' -exec cp {} output/SnapKM.dylib \;
          test -s output/SnapKM.dylib
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SnapKM-dylib
          path: output/SnapKM.dylib
          if-no-files-found: error
