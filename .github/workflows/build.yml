name: Build SnapKM (rootless)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.m'
      - '**/*.h'
      - '**/*.xm'
      - 'Makefile'
      - 'control'
      - '.github/workflows/build.yml'

jobs:
  package:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$HOME/theos/sdks"
          find "$RUNNER_TEMP/theos-sdks" -maxdepth 1 -name '*.sdk' -type d -exec cp -R {} "$HOME/theos/sdks/" \;
          ls "$HOME/theos/sdks"
      - name: Build rootless package
        run: make package FINALPACKAGE=1
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: SnapKM-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
